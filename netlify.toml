[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify automatically provisions its maintained Next.js adapter.
# Keep secrets in the site's environment settings, never in this file.

[functions."scanner-health"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions."scanner-background"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]
